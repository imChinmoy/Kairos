name: kairos
description: KAIROS — Field Intelligence Application for Oil Spill Investigation. Ministry of Ports, Shipping and Waterways | NTRO SIH 2026.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Local persistence
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0

  # Secure storage (for JWT)
  flutter_secure_storage: ^9.2.2

  # GPS / Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Camera
  image_picker: ^1.1.2
  camera: ^0.11.0+2

  # Crypto / SHA-256
  crypto: ^3.0.3

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # UI utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  collection: ^1.18.0

  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  google_fonts: ^8.2.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  vibration: ^3.2.1
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  hive_ce_generator: ^1.8.1
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.jpeg"
